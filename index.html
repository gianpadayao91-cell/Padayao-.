<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Gian Padayao — Computer Science at Catanduanes State University">
<title>Gian Padayao — Portfolio</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--accent:#38bdf8;--text:#f1f5f9;--muted:#94a3b8;--border:#334155;--g1:#38bdf8;--g2:#8b5cf6}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%);color:var(--text);line-height:1.7;min-height:100vh;background-attachment:fixed}
a{color:inherit;text-decoration:none}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:99;background:rgba(15,23,42,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-wrap{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{font-size:24px;font-weight:800;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:28px;list-style:none}
.nav-links a{color:var(--muted);font-weight:500}
.nav-links a:hover{color:var(--accent)}
.hero{min-height:85vh;display:flex;align-items:center;gap:40px;padding:70px 0;flex-wrap:wrap}
.hero-text{flex:1;min-width:280px}
.hero-greeting{color:var(--accent);font-weight:700;margin-bottom:8px}
.hero h1{font-size:clamp(40px,6vw,64px);line-height:1.1;margin-bottom:16px}
.hero h1 span{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:18px;color:var(--muted);margin-bottom:28px;max-width:500px}
.btn{padding:13px 28px;border-radius:12px;font-weight:700;border:none;cursor:pointer;display:inline-block}
.btn-primary{background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff;box-shadow:0 4px 20px rgba(56,189,248,.3)}
.btn-outline{border:2px solid var(--accent);color:var(--accent)}
.hero-image{width:300px;height:300px;border-radius:24px;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;font-size:80px;box-shadow:0 0 30px rgba(56,189,248,.3)}
section{padding:80px 0}
.section-header{text-align:center;margin-bottom:50px}
.section-tag{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:13px}
.section-title{font-size:36px;margin:8px 0}
.section-desc{color:var(--muted);max-width:600px;margin:0 auto}
.about-content{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.about-card{background:var(--card);padding:28px;border-radius:18px;border:1px solid var(--border)}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.skill-card{background:var(--card);padding:26px;border-radius:16px;border:1px solid var(--border);transition:.3s}
.skill-card:hover{transform:translateY(-4px);border-color:var(--accent)}
.contact-box{background:var(--card);padding:36px;border-radius:18px;border:1px solid var(--border);text-align:center;max-width:640px;margin:0 auto}
footer{padding:30px 0;text-align:center;color:var(--muted);border-top:1px solid var(--border);margin-top:40px}
@media(max-width:780px){.about-content{grid-template-columns:1fr}.nav-links{display:none}.hero{flex-direction:column-reverse;text-align:center}.hero-sub{margin:0 auto 20px}}
</style>
</head>
<body>

<div class="logo">Gian Padayao</div>
<ul class="nav-links">

<li><a href="#about">About</a></li>
<li><a href="#skills">Skills</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</div>
</header>

<div class="container">

<div class="hero-text">
<div class="hero-greeting">Hello, I'm</div>
<h1>Gian <span>Padayao</span></h1>
<p class="hero-sub">Computer Science student at Catanduanes State University. Building clean and modern web experiences.</p>
<div style="display:flex;gap:12px;flex-wrap:wrap">
<a href="#contact" class="btn btn-primary">Contact Me</a>
<a href="#about" class="btn btn-outline">About Me</a>
</div>
</div>
<div class="hero-image">👨‍💻</div>
</section>

<div class="section-header">
<div class="section-tag">About</div>
<h2 class="section-title">Who I Am</h2>
<p class="section-desc">A dedicated CS student focused on development and continuous learning.</p>
</div>
